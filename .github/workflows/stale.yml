name: Manage stale issues

on:
  push:
    paths:
      - .github/workflows/stale.yml
    branches-ignore:
      - dependabot/**
  schedule:
    # Once every day at midnight UTC
    - cron: "0 0 * * *"
  issue_comment:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale-issues
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  stale:
    if: >
      github.event_name != 'issue_comment' || (
        contains(github.event.issue.labels.*.name, 'stale')
      )
    runs-on: ubuntu-slim
    permissions:
      # Lets the action clean up the cache it uses to save state between runs.
      actions: write
      # Needed for delete-branch on closed PRs.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mark/Close Stale Issues and Pull Requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 7
          days-before-close: 3
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity
            occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed if no further
            activity occurs.
          exempt-issue-labels: "keep-open"
          exempt-pr-labels: "keep-open"
          delete-branch: true
